services:
  - type: web
    name: pathguru-publishers-api
    runtime: node
    # A free web service spins down after 15 minutes idle and takes ~1 minute to
    # wake. The Cloudflare Worker's */5 cron keeps it warm — but that consumes
    # roughly 730 of the 750 free instance-hours granted per WORKSPACE per
    # calendar month. One always-warm free service fits; two do not, and the
    # second one takes every free service in the workspace down with it around
    # mid-month. If a second free service is ever added here, move this one to a
    # paid plan first.
    plan: free
    # pandoc: system binary for DOCX/PDF generation from markdown (consulting docs)
    buildCommand: apt-get install -y pandoc && npm install && npx playwright install --with-deps chromium
    startCommand: npm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production

      # ── Operator auth (console login; gate for every /api/* route) ──
      # Without PATHGURU_OPERATOR_PASSWORD the server fails closed and all
      # protected routes (agent orchestration, tasks, leads, posts, …) return 503.
      # Set in the Render dashboard; sync:false means deploys never overwrite it.
      - key: PATHGURU_OPERATOR_PASSWORD
        sync: false
      - key: PATHGURU_OPERATOR_TOKEN
        sync: false
      - key: PATHGURU_OPERATOR_SECRET
        sync: false

      # ── AI Provider ──────────────────────────────
      - key: AI_PROVIDER
        value: deepseek          # gemini | claude | deepseek | cerebras | perplexity
      - key: AI_MAX_TOKENS
        value: "65536"

      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      - key: CLAUDE_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6

      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat

      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: llama3.3-70b

      - key: PERPLEXITY_API_KEY
        sync: false
      - key: PERPLEXITY_MODEL
        value: sonar-pro

      # ── Research ─────────────────────────────────
      - key: TAVILY_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false

      # ── Assets ───────────────────────────────────
      - key: PEXELS_API_KEY
        sync: false

      # ── Storage ──────────────────────────────────
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

      # ── Database ─────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── DigiFusion CMS integration ────────────────
      # The public hostname, deliberately. It resolves Cloudflare → Vercel.
      #
      # Two traps live here, both cost a morning to find:
      #
      #   THE NAMES DIFFER ON PURPOSE. This service sends DIGIFUSION_CMS_TOKEN;
      #   the CMS reads PATHGURU_CMS_TOKEN (digifusion/lib/cms/auth.ts). Each is
      #   named for the other party. The VALUES must match, the KEYS must not.
      #   Renaming either to match the other breaks it — requireCmsToken finds
      #   nothing and every call returns 503 CMS_NOT_CONFIGURED.
      #
      #   CLOUDFLARE BOT FIGHT MODE CHALLENGES THIS CALLER. Server-to-server
      #   requests arrive from a datacenter ASN with user agent "node" and no
      #   JavaScript, so Cloudflare served a "Just a moment..." interstitial and
      #   the fetch saw 403 — with nothing in Security Events, because free-plan
      #   Bot Fight Mode does not log there. Fixed by allowing this service's
      #   outbound IPs in Cloudflare → Security → WAF → Tools → IP Access Rules.
      #   IF THIS SERVICE'S OUTBOUND IPs EVER CHANGE, that allowlist must change
      #   with them or the CMS goes dark again. Render → Connect → Outbound IPs.
      - key: DIGIFUSION_API_URL
        value: https://www.digitafusion.com
      - key: DIGIFUSION_CMS_TOKEN
        sync: false

      # ── Agent network ─────────────────────────────
      - key: CALENDLY_BOOKING_URL
        sync: false

      # ── External cron (UptimeRobot keep-alive + CEO scheduled jobs) ─────
      - key: CRON_SECRET
        sync: false

      # ── Notifications ─────────────────────────────
      # Slack is the primary approval + conversation surface. A missing var is
      # logged at boot ([Slack] DISABLED) and the health endpoint reports
      # slackConfigured:false — it never fails silently, because weeks of
      # approvals once went nowhere while postSlackApproval returned {skipped}.
      #
      # Slack REACHES us through the Cloudflare Worker, not here: Slack demands
      # a 3-second ack and a cold instance on the free plan takes about a
      # minute. The Worker verifies the v0 signature, answers url_verification
      # and slash commands synchronously, and queues the rest. SLACK_SIGNING_
      # SECRET is therefore set in BOTH places — the Worker verifies inbound,
      # this service verifies the legacy /api/webhooks/slack route kept for
      # local testing.
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_APPROVAL_CHANNEL
        sync: false
      - key: SLACK_OPS_CHANNEL
        sync: false
      # The workspace member id permitted to run /pause and /resume. Slack has
      # no per-command permission setting, so this guard lives in code and is
      # the only thing between "halt the estate" and anyone in the workspace.
      - key: SLACK_OWNER_USER_ID
        sync: false
      - key: ONESIGNAL_APP_ID
        sync: false
      - key: ONESIGNAL_API_KEY
        sync: false
      - key: WHATSAPP_TO
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_STATUS_CALLBACK_URL
        sync: false
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      # Shared with the Cloudflare Worker, which signs its wake calls to
      # /api/queue/drain with it. The two values must be identical or the drain
      # 401s every five minutes and the queue fills silently.
      - key: INBOUND_WEBHOOK_SECRET
        sync: false
      # Make → this service, for the outbound-draft routes.
      - key: MAKE_OUTBOUND_TOKEN
        sync: false

      # ── NOT declared here, deliberately ───────────
      # These live on the Cloudflare Worker (wrangler secret put), not on this
      # service. Listed so nobody hunts for them in this file:
      #   MAKE_WEBHOOK_TOKEN   — Make → Worker bearer, both webhook routes
      #   SLACK_SIGNING_SECRET — also on the Worker; see the note above
      #   CRON_SECRET          — also on the Worker, for the digest/purge crons
      #   SUPABASE_URL + anon key — the Worker inserts to webhook_queue only

      # ── Vektor ───────────────────────────────────
      - key: VEKTOR_ADMIN_KEY
        sync: false
      - key: VEKTOR_SERVICE_KEY
        sync: false

      # ── KDP Defaults ─────────────────────────────
      - key: KDP_DEFAULT_TRIM_WIDTH_IN
        value: "6"
      - key: KDP_DEFAULT_TRIM_HEIGHT_IN
        value: "9"
      - key: KDP_DEFAULT_BLEED
        value: "false"
      - key: KDP_DEFAULT_INTERIOR
        value: black-and-white
      - key: KDP_MIN_FONT_SIZE_PT
        value: "7"
      - key: KDP_MIN_IMAGE_DPI
        value: "300"
