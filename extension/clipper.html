<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PathGuru Clipper</title>
  <style>
    :root {
      --bg: #0a0e17;
      --surface: #111827;
      --border: #263047;
      --gold: #c9a84c;
      --text: #f0f4ff;
      --muted: #8fa3c0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .brand-mark {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #a88932, #c9a84c);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; color: #0a0e17;
    }
    .brand-name { font-weight: 600; color: var(--text); }
    .brand-sub  { font-size: 10px; color: var(--muted); }

    .page-info {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .page-label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
    .page-title { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-url   { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    .field { margin-bottom: 12px; }
    label  { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
    input  { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 7px 10px; font-size: 12px; font-family: inherit; outline: none; }
    input:focus { border-color: var(--gold); }
    input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 9px;
      background: linear-gradient(135deg, #a88932, #c9a84c);
      border: none;
      border-radius: 6px;
      color: #0a0e17;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(1.08); }

    .url-field { margin-bottom: 12px; }

    .status { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; min-height: 16px; }
    .status.ok  { color: #3ecf8e; }
    .status.err { color: #ef4444; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-mark">PG</div>
    <div>
      <div class="brand-name">PathGuru Publishers</div>
      <div class="brand-sub">Research Clipper</div>
    </div>
  </div>

  <div class="page-info">
    <div class="page-label">Current page</div>
    <div class="page-title" id="pageTitle">Loading…</div>
    <div class="page-url"   id="pageUrl"></div>
  </div>

  <div class="url-field field">
    <label for="appUrl">PathGuru app URL</label>
    <input type="url" id="appUrl" placeholder="https://your-app.onrender.com">
  </div>

  <div class="field">
    <label for="topicOverride">Topic override (optional)</label>
    <input type="text" id="topicOverride" placeholder="Leave blank to use page title">
  </div>

  <button class="btn" id="clipBtn">Open in PathGuru →</button>
  <div class="status" id="status"></div>

  <script src="clipper.js"></script>
</body>
</html>
